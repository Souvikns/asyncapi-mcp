services:
  db:
    image: postgres:16-alpine
    container_name: asyncapi-mcp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asyncapi_mcp
    ports:
      - '5432:5432'
    volumes:
      - asyncapi-mcp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d asyncapi_mcp']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  asyncapi-mcp-pgdata:
